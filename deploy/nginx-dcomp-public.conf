# Instalar em /etc/nginx/sites-available/dcomp-drive-public
# Backend isolado: 127.0.0.1:18001 (nunca o controller privado em :8000).
# Os métodos e caminhos expostos são uma allowlist: endpoints internos e
# administrativos permanecem inacessíveis publicamente.
limit_req_zone $binary_remote_addr zone=dcomp_public:10m rate=6r/s;

server {
    listen 80;
    server_name 34.193.62.218;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name 34.193.62.218;
    ssl_certificate /etc/letsencrypt/live/34.193.62.218/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34.193.62.218/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    client_max_body_size 2m;
    limit_req zone=dcomp_public burst=20 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    location = / { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /status { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /metrics { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /health { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /demo/config { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /files/catalog { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /files/metadata { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /files/entries { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location ^~ /ui/ { limit_except GET { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /files/content { limit_except GET PUT { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /files/directories { limit_except POST DELETE { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /files/move { limit_except POST { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /files/entry { limit_except DELETE { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /demo/public/files/corrupt { limit_except POST { deny all; } proxy_pass http://127.0.0.1:18001; }
    location = /demo/public/reset { limit_except POST { deny all; } proxy_pass http://127.0.0.1:18001; }
    location ~ ^/demo/public/nodes/storage-[1-5]/(offline|restore|drain|undrain)$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18001;
    }
    location / { return 404; }
}
