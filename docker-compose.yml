services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dcomp_drive
      POSTGRES_USER: dcomp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcomp -d dcomp_drive"]
      interval: 3s
      timeout: 3s
      retries: 15

  controller:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn controller.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://dcomp:${POSTGRES_PASSWORD:?configure .env}@postgres:5432/dcomp_drive
      NODE_TIMEOUT_SECONDS: ${NODE_TIMEOUT_SECONDS:-6}
      MONITOR_INTERVAL_SECONDS: "2"
      REPLICATION_FACTOR: ${REPLICATION_FACTOR:-3}
      WRITE_TIMEOUT_SECONDS: ${WRITE_TIMEOUT_SECONDS:-300}
      MAX_TRANSFER_BYTES: ${MAX_TRANSFER_BYTES:-33554432}
      REPAIR_INTERVAL_SECONDS: ${REPAIR_INTERVAL_SECONDS:-2}
      REPAIR_CLAIM_SECONDS: ${REPAIR_CLAIM_SECONDS:-180}
      MAX_CONCURRENT_RECOVERIES: "${MAX_CONCURRENT_RECOVERIES:-1}"
      REPAIR_BANDWIDTH_BYTES_PER_SEC: "${REPAIR_BANDWIDTH_BYTES_PER_SEC:-0}"
      MAX_DISK_USAGE_PERCENT: ${MAX_DISK_USAGE_PERCENT:-90}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  storage-1: &storage
    build: .
    command: uvicorn storage.main:app --host 0.0.0.0 --port 9000
    environment: &storage_env
      NODE_ID: storage-1
      MACHINE_ID: storage-1
      STORAGE_ADDRESS: http://storage-1:9000
      CONTROLLER_URL: http://controller:8000
      HEARTBEAT_INTERVAL_SECONDS: "2"
      SCRUB_INTERVAL_SECONDS: "${SCRUB_INTERVAL_SECONDS:-15}"
      DATA_DIR: /data
    volumes: [storage1_data:/data]
    depends_on:
      - controller

  storage-2:
    <<: *storage
    environment:
      <<: *storage_env
      NODE_ID: storage-2
      MACHINE_ID: storage-2
      STORAGE_ADDRESS: http://storage-2:9000
    volumes: [storage2_data:/data]

  storage-3:
    <<: *storage
    environment:
      <<: *storage_env
      NODE_ID: storage-3
      MACHINE_ID: storage-3
      STORAGE_ADDRESS: http://storage-3:9000
    volumes: [storage3_data:/data]

  storage-4:
    <<: *storage
    environment:
      <<: *storage_env
      NODE_ID: storage-4
      MACHINE_ID: storage-4
      STORAGE_ADDRESS: http://storage-4:9000
    volumes: [storage4_data:/data]

  storage-5:
    <<: *storage
    environment:
      <<: *storage_env
      NODE_ID: storage-5
      MACHINE_ID: storage-5
      STORAGE_ADDRESS: http://storage-5:9000
    volumes: [storage5_data:/data]

volumes:
  postgres_data:
  storage1_data:
  storage2_data:
  storage3_data:
  storage4_data:
  storage5_data:
